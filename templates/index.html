<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathy Travels | Book flights from Juba</title>

    <meta
      name="description"
      content="Search, compare and book flights from Juba to Nairobi, Entebbe, Addis Ababa, Dubai and more."
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon-32.png') }}"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="{{ url_for('static', filename='images/apple-touch-icon.png') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">
        <img
          class="logo-image"
          src="{{ url_for('static', filename='images/logo-blue.png') }}"
          alt="Mathy Travels"
        />
      </a>

      <nav class="menu" aria-label="Main Menu">
        <a class="menu-link" href="#search">Search flights</a>
        <a class="menu-link" href="#routes">Popular routes</a>
      </nav>
    </header>
    <main>
      <section class="hero" id="search">
        <div class="hero-text">
          <h1>Book flights from Juba</h1>
          <p>Search, compare and book in a few minutes</p>
        </div>
        <form class="search-form" id="search-form">
          <div class="field">
            <label for="origin">From</label>
            <input
              id="origin"
              name="origin"
              type="text"
              value="JUB"
              placeholder="Where to?"
              required
            />
          </div>

          <div class="field">
            <label for="destination">To</label>
            <input
              id="destination"
              name="destination"
              type="text"
              placeholder="Where to?"
              required
            />
          </div>

          <div class="field">
            <label for="date">Depart</label>
            <input id="date" name="date" type="date" required />
          </div>

          <div class="field">
            <label for="adults">Travellers</label>
            <select name="adults" id="adults">
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
            </select>
          </div>

          <div class="field">
            <label for="cabin">Cabin</label>
            <select name="cabin" id="cabin">
              <option value="economy">Economy</option>
              <option value="premium_economy">Premium economy</option>
              <option value="business">Business</option>
              <option value="first">First</option>
            </select>
          </div>

          <button class="search-button" type="submit">
            <span class="material-symbols-outlined" aria-hidden="true"
              >search</span
            >
            <span class="search-button-text">Search flights</span>
          </button>
        </form>
      </section>

      <div class="page-content">
        <section class="results" id="results" hidden>
          <p class="results-message" id="results-message" role="status"></p>

          <div class="results-toolbar">
            <div class="toolbar-field">
              <label for="sort-by">Sort by</label>
              <select id="sort-by">
                <option value="cheapest">Cheapest first</option>
                <option value="fastest">Fastest first</option>
                <option value="earliest">Earliest departure</option>
                <option value="latest">Lastest departure</option>
              </select>
            </div>

            <div class="toolbar-field">
              <label for="filter-stops">Stops</label>
              <select id="filter-stops">
                <option value="any">Any number</option>
                <option value="direct">Direct only</option>
              </select>
            </div>

            <div class="toolbar-field">
              <label for="filter-airline">Airline</label>
              <select id="filter-airline">
                <option value="all">All airlines</option>
              </select>
            </div>

            <div class="toolbar-field toolbar-search">
              <label for="search-results">Search</label>
              <input
                id="search-results"
                type="search"
                placeholder="Airline or flight number"
              />
            </div>
          </div>

          <div class="results-list" id="results-list"></div>

          <template id="flight-card-template">
            <article class="flight-card">
              <div class="flight-airline">
                <img class="airline-logo" src="" alt="" />
                <div class="airline-text">
                  <span class="airline-name"></span>
                  <span class="flight-number"></span>
                </div>
              </div>

              <div class="flight-times">
                <div class="flight-end">
                  <span class="flight-time departure-time"></span>
                  <span class="flight-code origin-code"></span>
                </div>

                <div class="flight-path">
                  <span class="flight-duration"></span>
                  <span class="flight-line"></span>
                  <span class="flight-stops"></span>
                </div>

                <div class="flight-end">
                  <span class="flight-time arrival-time"></span>
                  <span class="flight-code destination-code"></span>
                </div>
              </div>

              <div class="flight-price">
                <span class="price-amount"></span>
                <span class="price-note"></span>

                <a
                  class="select-button book-link"
                  href="#"
                  target="_blank"
                  rel="noopener"
                  >Book on WhatsApp</a
                >
              </div>
            </article>
          </template>
        </section>

        <section class="routes" id="routes">
          <h2>Popular routes from Juba</h2>
          <div class="routes-list">
            <button class="route-card" type="button" data-destination="NBO">
              <img
                class="route-image"
                src="{{ url_for('static', filename='images/nairobi.jpg') }}"
                alt=""
                loading="lazy"
              />
              <span class="route-text">
                <span class="route-code">NBO</span>
                <span class="route-city">Nairobi, Kenya</span>
              </span>
            </button>

            <button class="route-card" type="button" data-destination="EBB">
              <img
                class="route-image"
                src="{{ url_for('static', filename='images/entebbe.jpg') }}"
                alt=""
                loading="lazy"
              />
              <span class="route-text">
                <span class="route-code">EBB</span>
                <span class="route-city">Entebbe, Uganda</span>
              </span>
            </button>

            <button class="route-card" type="button" data-destination="ADD">
              <img
                class="route-image"
                src="{{ url_for('static', filename='images/addis-ababa.jpg') }}"
                alt=""
                loading="lazy"
              />
              <span class="route-text">
                <span class="route-code">ADD</span>
                <span class="route-city">Addis Ababa, Ethiopia</span>
              </span>
            </button>

            <button class="route-card" type="button" data-destination="DXB">
              <img
                class="route-image"
                src="{{ url_for('static', filename='images/dubai.jpg') }}"
                alt=""
                loading="lazy"
              />
              <span class="route-text">
                <span class="route-code">DXB</span>
                <span class="route-city">Dubai, United Arab Emirates</span>
              </span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
